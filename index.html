<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WaleedFlixer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Syne:wght@700;800&display=swap"
    rel="stylesheet" />

  <style>
    :root {
      --red: #ff1744;
      --red2: #ff4569;
      --red-glow: rgba(255, 23, 68, 0.35);
      --dark: #080810;
      --dark2: #0d0d18;
      --surface: #111120;
      --surface2: #16162a;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text: #eeeef5;
      --muted: #6b6b88;
      --muted2: #9999b8;
      --gold: #ffd60a;
      --green: #39d98a;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--dark);
      color: var(--text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      cursor: default;
      padding-top: 72px;
    }


    /* ── CUSTOM SCROLLBAR ── */
    ::-webkit-scrollbar {
      width: 3px;
      height: 0;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--red);
      border-radius: 99px;
    }

    /* ── FLOATING PARTICLES ── */
    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      animation: floatParticle linear infinite;
      opacity: 0;
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 0.4;
      }

      100% {
        transform: translateY(-20vh) scale(1.2);
        opacity: 0;
      }
    }

    /* ── BRAND HEADER ── */
    h1,
    h2,
    h3,
    .brand {
      font-family: 'Syne', sans-serif;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 200;
      transition: all 0.5s ease;
      padding: 0;
    }

    nav::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(8, 8, 16, 0.97) 0%, rgba(8, 8, 16, 0.7) 70%, transparent 100%);
      transition: opacity 0.5s;
    }

    nav.scrolled::before {
      background: rgba(8, 8, 16, 0.96);
      backdrop-filter: blur(20px) saturate(1.5);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05), 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .nav-inner {
      position: relative;
      max-width: 100%;
      margin: 0 auto;
      padding: 0 4%;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.6rem;
      color: #fff;
      text-decoration: none;
      letter-spacing: -0.02em;
      flex-shrink: 0;
      position: relative;
      transition: all 0.3s;
    }

    .brand-logo .w-accent {
      color: var(--red);
      text-shadow: 0 0 20px var(--red-glow), 0 0 40px var(--red-glow);
    }

    .brand-logo:hover {
      filter: brightness(1.15);
    }

    .nav-links {
      display: flex;
      gap: 0.25rem;
      align-items: center;
      flex-shrink: 0;
    }

    .nav-link {
      color: var(--muted2);
      font-size: 0.82rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s;
      background: none;
      border: none;
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      letter-spacing: 0.01em;
    }

    .nav-link:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-link.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.07);
    }

    /* ── SEARCH ── */
    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 260px;
    }

    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 0.55rem 1rem 0.55rem 2.6rem;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 0.82rem;
      outline: none;
      transition: all 0.3s;
    }

    .search-input:focus {
      border-color: rgba(255, 23, 68, 0.5);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 3px rgba(255, 23, 68, 0.1);
    }

    .search-input::placeholder {
      color: var(--muted);
    }

    .search-icon {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      transition: color 0.3s;
    }

    .search-input:focus~.search-icon,
    .search-wrap:focus-within .search-icon {
      color: var(--red);
    }

    /* ── TAB GROUP ── */
    .tab-group {
      display: flex;
      gap: 2px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 3px;
      flex-shrink: 0;
    }

    .tab-btn {
      padding: 0.4rem 1rem;
      border-radius: 9px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--muted2);
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 5px;
      letter-spacing: 0.01em;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn.active {
      background: var(--red);
      color: #fff;
      box-shadow: 0 2px 12px rgba(255, 23, 68, 0.4);
    }

    /* ══════════════════════════════════ HERO ══════════════════════════════════ */
    .hero {
      position: relative;
      height: 90vh;
      min-height: 550px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      background: linear-gradient(135deg, var(--surface) 0%, var(--dark) 40%, var(--surface2) 100%);
    }

    .hero-bg {
      position: absolute;
      inset: -5%;
      background-size: cover;
      background-position: center 20%;
      transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      transform: scale(1.05);
      filter: saturate(1.2);
    }

    .hero-bg.transitioning {
      opacity: 0;
      transform: scale(1.1);
    }

    .hero-vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 70% 40%, transparent 40%, rgba(8, 8, 16, 0.7) 100%),
        linear-gradient(to right, rgba(8, 8, 16, 0.95) 0%, rgba(8, 8, 16, 0.5) 45%, rgba(8, 8, 16, 0.1) 100%),
        linear-gradient(to top, rgba(8, 8, 16, 1) 0%, rgba(8, 8, 16, 0.4) 18%, transparent 50%);
    }

    /* Animated scanline effect */
    .hero-scan {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.015) 2px,
          rgba(0, 0, 0, 0.015) 4px);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 10;
      padding: 0 5% 13vh;
      width: 100%;
      max-width: 680px;
    }

    /* Animated badge */
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: linear-gradient(135deg, var(--red), var(--red2));
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 99px;
      margin-bottom: 1.2rem;
      box-shadow: 0 0 20px rgba(255, 23, 68, 0.4);
      animation: pulseBadge 2.5s ease-in-out infinite;
    }

    @keyframes pulseBadge {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(255, 23, 68, 0.4);
      }

      50% {
        box-shadow: 0 0 35px rgba(255, 23, 68, 0.7), 0 0 60px rgba(255, 23, 68, 0.2);
      }
    }

    .hero-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      font-weight: 800;
      line-height: 0.95;
      color: #fff;
      margin-bottom: 1.2rem;
      letter-spacing: -0.03em;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      animation: heroTitleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes heroTitleIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.82rem;
      color: var(--muted2);
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .hero-meta-sep {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--muted);
    }

    .hero-rating {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(57, 217, 138, 0.12);
      color: var(--green);
      border: 1px solid rgba(57, 217, 138, 0.2);
      border-radius: 99px;
      padding: 3px 10px;
      font-weight: 700;
      font-size: 0.75rem;
    }

    .hero-overview {
      max-width: 520px;
      font-size: 0.95rem;
      line-height: 1.65;
      color: rgba(238, 238, 245, 0.75);
      margin-bottom: 2rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-weight: 400;
    }

    .hero-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      color: #000;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.75rem 2rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Outfit', sans-serif;
      letter-spacing: -0.01em;
    }

    .btn-primary:hover {
      background: #f0f0f0;
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(255, 255, 255, 0.2);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.75rem 1.75rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
      font-family: 'Outfit', sans-serif;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    /* Hero dots */
    .hero-dots {
      display: flex;
      gap: 6px;
      margin-top: 2rem;
      align-items: center;
    }

    .hero-dot {
      height: 3px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: none;
      width: 16px;
    }

    .hero-dot.active {
      background: var(--red);
      width: 36px;
      box-shadow: 0 0 10px var(--red-glow);
    }

    /* ══════════════════════════════ MAIN CONTENT ══════════════════════════════ */
    .main-content {
      padding: 0 0 5rem;
      position: relative;
      z-index: 5;
      margin-top: -10vh;
    }

    /* ══════════════════════════════ ROW SECTIONS ══════════════════════════════ */
    .nfx-row-section {
      margin-bottom: 2.5rem;
      position: relative;
    }

    .nfx-row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4%;
      margin-bottom: 1rem;
    }

    .nfx-row-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .nfx-row-title span {
      color: var(--red);
    }

    .search-count {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
      white-space: nowrap;
    }

    .nfx-row-section.searching {
      margin-top: 3rem;
      padding-top: 1rem;
    }

    .nfx-row-section.searching .nfx-row-header {
      padding: 0 4%;
    }

    .nfx-row-section.searching .nfx-row-title {
      font-size: 1.1rem;
    }

    .nfx-row-section.searching .nfx-row-title::before {
      display: none;
    }

    .nfx-row-section.searching .nfx-row-title span {
      color: var(--text);
    }

    .main-content.search-active {
      margin-top: 0;
      padding-top: 1.5rem;
    }

    .nfx-row-tag {
      font-size: 0.55rem;
      background: linear-gradient(135deg, var(--red), var(--red2));
      color: #fff !important;
      padding: 3px 9px;
      border-radius: 99px;
      font-weight: 800;
      letter-spacing: 0.1em;
      box-shadow: 0 2px 8px rgba(255, 23, 68, 0.35);
      animation: pulseBadge 2.5s ease-in-out infinite;
    }

    .see-all {
      font-size: 0.75rem;
      color: var(--muted2);
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
    }

    .see-all:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .nfx-row-wrap {
      position: relative;
      padding: 0 4%;
      overflow: visible;
    }

    .nfx-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      overflow-y: visible;
      scroll-behavior: smooth;
      scrollbar-width: none;
      padding: 3rem 0 3rem;
      margin: -3rem 0 -3rem;
    }

    .nfx-row::-webkit-scrollbar {
      display: none;
    }

    /* Row arrows */
    .nfx-row-arrow {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 60px;
      background: linear-gradient(90deg, rgba(8, 8, 16, 0.95) 0%, transparent 100%);
      border: none;
      color: #fff;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
      opacity: 0;
    }

    .nfx-row-arrow .arrow-btn {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
    }

    .nfx-row-arrow:hover .arrow-btn {
      background: rgba(255, 23, 68, 0.7);
      border-color: var(--red);
      box-shadow: 0 0 20px var(--red-glow);
      transform: scale(1.1);
    }

    .nfx-row-wrap:hover .nfx-row-arrow {
      opacity: 1;
    }

    .nfx-row-arrow.left {
      left: 0;
      background: linear-gradient(90deg, rgba(8, 8, 16, 0.95) 0%, transparent 100%);
    }

    .nfx-row-arrow.right {
      right: 0;
      background: linear-gradient(270deg, rgba(8, 8, 16, 0.95) 0%, transparent 100%);
    }

    /* ══════════════════════════════ CARDS ══════════════════════════════ */
    .nfx-card {
      flex-shrink: 0;
      width: 185px;
      border-radius: 14px;
      overflow: visible;
      cursor: pointer;
      position: relative;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s ease, z-index 0s 0.35s;
    }

    .nfx-card-inner {
      border-radius: 14px;
      overflow: hidden;
      background: var(--surface);
      position: relative;
    }

    .nfx-card:hover {
      transform: scale(1.12) translateY(-8px);
      z-index: 100;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s ease, z-index 0s;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 23, 68, 0.3), 0 0 30px rgba(255, 23, 68, 0.1);
    }

    .nfx-card-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
      background: var(--surface2);
      transition: filter 0.35s;
    }

    .nfx-card:hover .nfx-card-poster {
      filter: brightness(0.75);
    }

    .nfx-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top,
          rgba(8, 8, 16, 0.98) 0%,
          rgba(8, 8, 16, 0.5) 40%,
          transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nfx-card:hover .nfx-card-overlay {
      opacity: 1;
    }

    .nfx-card-play {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--red), var(--red2));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      transform: scale(0) rotate(-90deg);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 20px rgba(255, 23, 68, 0.5);
      position: absolute;
      top: 50%;
      left: 50%;
      margin: -24px 0 0 -24px;
    }

    .nfx-card:hover .nfx-card-play {
      transform: scale(1) rotate(0deg);
    }

    .nfx-card-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.8rem;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform: translateY(6px);
    }

    .nfx-card:hover .nfx-card-info {
      opacity: 1;
      transform: translateY(0);
    }

    .nfx-card-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 5px;
      font-family: 'Syne', sans-serif;
      letter-spacing: -0.01em;
    }

    .nfx-card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.65rem;
      color: var(--muted2);
    }

    .nfx-card-rating {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: var(--gold);
      font-weight: 700;
    }

    /* ── SKELETON ── */
    .skeleton {
      background: linear-gradient(90deg, var(--surface2) 25%, rgba(255, 255, 255, 0.04) 50%, var(--surface2) 75%);
      background-size: 400% 100%;
      animation: shimmer 1.8s ease-in-out infinite;
      border-radius: 6px;
    }

    @keyframes shimmer {
      0% {
        background-position: 100% 0;
      }

      100% {
        background-position: -100% 0;
      }
    }

    .skeleton-card {
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
      width: 185px;
      background: var(--surface);
    }

    .skeleton-poster {
      width: 100%;
      aspect-ratio: 2/3;
    }

    .skeleton-line {
      height: 11px;
      margin: 0.75rem 0.75rem 5px;
      width: 70%;
    }

    .skeleton-line-sm {
      height: 9px;
      width: 45%;
      margin: 0 0.75rem 0.75rem;
    }

    /* ══════════════════════════════ MODAL ══════════════════════════════ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(16px) saturate(0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 1100px;
      background: var(--dark2);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: 95vh;
      animation: modalIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(0.88) translateY(30px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.5rem;
      background: rgba(255, 255, 255, 0.02);
      flex-shrink: 0;
      border-bottom: 1px solid var(--glass-border);
    }

    .modal-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: calc(100% - 80px);
      letter-spacing: -0.02em;
    }

    .source-switcher {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      margin-left: 0.75rem;
    }

    .source-btn {
      padding: 5px 14px;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: transparent;
      color: var(--muted2);
      transition: all 0.2s;
      white-space: nowrap;
      font-family: 'Outfit', sans-serif;
    }

    .source-btn:hover {
      border-color: rgba(255, 255, 255, 0.3);
      color: #fff;
    }

    .source-btn.active {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
      box-shadow: 0 2px 10px rgba(255, 23, 68, 0.4);
    }

    .modal-close {
      width: 38px;
      height: 38px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted2);
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .modal-close:hover {
      background: rgba(255, 23, 68, 0.15);
      border-color: rgba(255, 23, 68, 0.4);
      color: var(--red);
    }

    .player-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      flex-shrink: 0;
    }

    .player-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Episode bar */
    .episode-bar {
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      background: rgba(255, 255, 255, 0.02);
      flex-wrap: wrap;
      flex-shrink: 0;
      border-top: 1px solid var(--glass-border);
    }

    .ep-label {
      font-size: 0.75rem;
      color: var(--muted2);
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .ep-select {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      border-radius: 10px;
      padding: 7px 14px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.82rem;
      outline: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ep-select:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(255, 23, 68, 0.12);
    }

    .ep-select option {
      background: var(--dark2);
    }

    /* ══════════════════════════════ TOAST ══════════════════════════════ */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 600;
      background: rgba(13, 13, 24, 0.97);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 0.9rem 1.5rem;
      font-size: 0.82rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03);
      transform: translateY(120px) scale(0.9);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      max-width: 340px;
    }

    .toast.show {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .toast-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
      box-shadow: 0 0 8px var(--red-glow);
    }

    /* ══════════════════════════════ HISTORY PANEL ══════════════════════════════ */
    .history-backdrop {
      position: fixed;
      inset: 0;
      z-index: 400;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      display: none;
    }

    .history-backdrop.open {
      display: block;
    }

    .history-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 370px;
      max-width: 95vw;
      background: rgba(13, 13, 24, 0.98);
      backdrop-filter: blur(20px);
      border-left: 1px solid rgba(255, 255, 255, 0.07);
      z-index: 401;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -20px 0 60px rgba(0, 0, 0, 0.5);
    }

    .history-panel.open {
      transform: translateX(0);
    }

    .history-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem;
      border-bottom: 1px solid var(--glass-border);
      flex-shrink: 0;
    }

    .history-panel-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.15rem;
      color: #fff;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .history-panel-title span {
      color: var(--red);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .history-item {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      padding: 0.65rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.07);
    }

    .history-poster {
      width: 44px;
      height: 66px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--surface2);
    }

    .history-info {
      flex: 1;
      min-width: 0;
    }

    .history-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .history-meta {
      font-size: 0.68rem;
      color: var(--muted2);
    }

    .history-delete {
      width: 28px;
      height: 28px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .history-delete:hover {
      background: rgba(255, 23, 68, 0.15);
      border-color: rgba(255, 23, 68, 0.3);
      color: var(--red);
    }

    .history-empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .history-clear-btn {
      margin: 0;
      padding: 1rem 1.5rem;
      background: rgba(255, 23, 68, 0.08);
      border: none;
      border-top: 1px solid var(--glass-border);
      color: #ff6b6b;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Outfit', sans-serif;
      text-align: center;
    }

    .history-clear-btn:hover {
      background: rgba(255, 23, 68, 0.15);
    }

    /* ══════════════════════════════ EMPTY STATE ══════════════════════════════ */
    .empty-state {
      text-align: center;
      padding: 5rem 1rem;
      color: var(--muted);
    }

    .empty-state h3 {
      font-family: 'Syne', sans-serif;
      font-size: 1.15rem;
      color: var(--text);
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    /* ══════════════════════════════ MOBILE BOTTOM NAV ══════════════════════════════ */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 300;
      background: rgba(8, 8, 16, 0.97);
      backdrop-filter: blur(20px) saturate(1.5);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding: 0.6rem 0 max(0.6rem, env(safe-area-inset-bottom));
    }

    .mobile-bottom-nav-inner {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .mobile-nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.25s;
      padding: 0.3rem 1rem;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
    }

    .mobile-nav-btn span {
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .mobile-nav-btn.active,
    .mobile-nav-btn:hover {
      color: var(--red);
    }

    .mobile-nav-btn.active .mobile-icon-wrap {
      background: rgba(255, 23, 68, 0.12);
    }

    .mobile-icon-wrap {
      width: 36px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      transition: background 0.25s;
    }

    /* ══════════════════════════════ MOBILE SEARCH ══════════════════════════════ */
    .mobile-search-bar {
      display: none;
      padding: 0.5rem 4% 0.75rem;
      background: rgba(8, 8, 16, 0.97);
      border-bottom: 1px solid var(--glass-border);
      position: fixed;
      top: 72px;
      left: 0;
      right: 0;
      z-index: 199;
    }

    .mobile-search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 0.65rem 1rem 0.65rem 2.5rem;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.3s;
    }

    .mobile-search-input:focus {
      border-color: rgba(255, 23, 68, 0.5);
      box-shadow: 0 0 0 3px rgba(255, 23, 68, 0.1);
    }

    .mobile-search-wrap {
      position: relative;
    }

    .mobile-search-icon {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    /* ══════════════════════════════ RESPONSIVE ══════════════════════════════ */
    @media (max-width: 900px) {
      .hero {
        height: 62vh;
        min-height: 420px;
      }

      .hero-content {
        padding: 0 4% 6vh;
        max-width: 100%;
      }

      .hero-title {
        font-size: clamp(2rem, 6vw, 3.5rem);
      }

      .hero-overview {
        -webkit-line-clamp: 2;
      }

      .nfx-card {
        width: 150px;
      }

      .skeleton-card {
        width: 150px;
      }
    }

    @media (max-width: 700px) {
      .nav-links {
        display: none;
      }

      .tab-group {
        display: none !important;
      }

      .search-wrap {
        display: none;
      }

      .mobile-bottom-nav {
        display: block;
      }

      .mobile-search-bar {
        display: block;
        position: fixed;
        top: 60px;
        left: 0;
        right: 0;
        z-index: 199;
        background: rgba(8, 8, 16, 0.97);
        border-bottom: 1px solid var(--glass-border);
        padding: 0.5rem 4% 0.75rem;
      }

      body {
        padding-bottom: 70px;
        padding-top: 110px;
      }

      .nav-inner {
        height: 60px;
        padding: 0 4%;
      }

      .brand-logo {
        font-size: 1.35rem;
      }

      .hero {
        height: 55vh;
        min-height: 380px;
        background: linear-gradient(135deg, var(--surface) 0%, var(--dark) 40%, var(--surface2) 100%);
      }

      .hero-bg {
        position: absolute;
        inset: -5%;
        background-size: cover;
        background-position: center 20%;
      }

      .hero-vignette {
        background:
          linear-gradient(to top, rgba(8, 8, 16, 1) 0%, rgba(8, 8, 16, 0.7) 25%, rgba(8, 8, 16, 0.4) 50%, rgba(8, 8, 16, 0.6) 100%),
          linear-gradient(to right, rgba(8, 8, 16, 0.95) 0%, rgba(8, 8, 16, 0.3) 100%);
      }

      .hero-content {
        padding: 0 4% 7vh;
        z-index: 10;
      }

      .hero-title {
        font-size: clamp(1.8rem, 5.5vw, 2.8rem);
        margin-bottom: 0.75rem;
      }

      .hero-overview {
        font-size: 0.85rem;
        -webkit-line-clamp: 2;
      }

      .hero-badge {
        font-size: 0.6rem;
        padding: 5px 12px;
      }

      .btn-primary,
      .btn-secondary {
        font-size: 0.82rem;
        padding: 0.6rem 1.3rem;
      }

      .btn-secondary {
        display: none;
      }

      .nfx-card {
        width: 120px;
      }

      .skeleton-card {
        width: 120px;
      }

      .nfx-card:hover {
        transform: none;
        box-shadow: none;
      }

      .nfx-card:active {
        transform: scale(0.96);
      }

      .nfx-card-overlay {
        opacity: 1;
        background: linear-gradient(to top, rgba(8, 8, 16, 0.9) 0%, rgba(8, 8, 16, 0.4) 35%, transparent 70%);
      }

      .nfx-card-info {
        opacity: 1;
        transform: none;
      }

      .nfx-card-play {
        display: none;
      }

      .nfx-row-title {
        font-size: 1rem;
      }

      .nfx-row-arrow {
        display: none;
      }

      .continue-card {
        width: 185px;
      }

      .continue-card:hover {
        transform: none;
        box-shadow: none;
      }

      .continue-overlay {
        opacity: 1;
      }

      .continue-play-icon {
        transform: scale(0.8);
      }

      .modal {
        max-width: 100%;
        border-radius: 16px 16px 0 0;
        margin: 0;
        align-self: flex-end;
      }

      .modal-backdrop {
        padding: 0;
        align-items: flex-end;
      }

      .player-wrap {
        min-height: 180px;
      }

      .toast {
        bottom: 90px;
        right: 1rem;
        left: 1rem;
        max-width: 100%;
      }

      #particles {
        display: none;
      }

      .main-content {
        margin-top: -6vh;
      }
    }

    @media (max-width: 400px) {
      .nfx-card {
        width: 100px;
      }

      .skeleton-card {
        width: 100px;
      }

      .hero-badge {
        display: none;
      }

      .continue-card {
        width: 160px;
      }
    }

    /* ══════════════════════════════ CONTINUE WATCHING ══════════════════════════════ */
    .continue-section {
      display: none;
    }

    .continue-nav {
      display: flex;
      gap: 6px;
    }

    .continue-nav-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: var(--muted2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .continue-nav-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .continue-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .continue-edit-btn {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted2);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .continue-edit-btn:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .continue-edit-btn.danger {
      background: var(--red);
      border-color: transparent;
      color: #fff;
    }

    .continue-edit-btn.danger:hover {
      background: var(--red2);
      color: #fff;
    }

    .continue-edit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .continue-section.edit-mode .continue-card {
      cursor: pointer;
    }

    .continue-select-dot {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: rgba(8, 8, 16, 0.55);
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
    }

    .continue-section.edit-mode .continue-select-dot {
      display: flex;
    }

    .continue-section.edit-mode .continue-overlay {
      display: none;
    }

    .continue-card.selected {
      box-shadow: 0 0 0 3px var(--red);
      border-radius: 16px;
    }

    .continue-card.selected .continue-select-dot {
      background: var(--red);
      border-color: var(--red);
    }

    .continue-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 0 4%;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .continue-row::-webkit-scrollbar {
      display: none;
    }

    .continue-card {
      position: relative;
      flex-shrink: 0;
      width: 270px;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.1, 0.64, 1);
    }

    .continue-card:hover {
      transform: translateY(-4px);
    }

    .continue-card:hover .continue-thumb {
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.6);
    }

    .continue-card.removing {
      opacity: 0;
      transform: scale(0.88) translateY(-10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .continue-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .continue-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .continue-card:hover .continue-thumb img {
      transform: scale(1.05);
    }

    .continue-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(8, 8, 16, 0.05) 0%, rgba(8, 8, 16, 0.35) 55%, rgba(8, 8, 16, 0.7) 100%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .continue-card:hover .continue-overlay {
      opacity: 1;
    }

    .continue-play-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--red);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 6px rgba(255, 23, 68, 0.25), 0 8px 24px rgba(255, 23, 68, 0.5);
      transform: scale(0.85);
      transition: transform 0.3s;
      pointer-events: auto;
      cursor: pointer;
    }

    .continue-card:hover .continue-play-icon {
      transform: scale(1);
    }

    .continue-progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: rgba(255, 255, 255, 0.18);
    }

    .continue-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--red), var(--red2));
      transition: width 0.4s ease;
    }

    .continue-info {
      padding: 0.6rem 0.15rem 0;
    }

    .continue-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .continue-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
      font-size: 0.72rem;
      color: var(--muted2);
    }

    .continue-state {
      font-weight: 600;
      color: var(--muted2);
      letter-spacing: 0.02em;
    }

    .continue-remain {
      margin-left: auto;
      color: var(--muted2);
      font-size: 0.68rem;
      font-weight: 500;
    }

    .continue-badge {
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #fff;
      background: linear-gradient(135deg, var(--red), var(--red2));
      padding: 2px 7px;
      border-radius: 99px;
    }

    /* ══════════════════════════════ ANIMATIONS ══════════════════════════════ */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-in {
      animation: fadeUp 0.6s cubic-bezier(0.34, 1.1, 0.64, 1) both;
    }

    /* Stagger children */
    .nfx-row-section:nth-child(1) {
      animation-delay: 0.05s;
    }

    .nfx-row-section:nth-child(2) {
      animation-delay: 0.12s;
    }

    .nfx-row-section:nth-child(3) {
      animation-delay: 0.2s;
    }

    /* Red line accents on rows */
    .nfx-row-title::before {
      content: '';
      display: inline-block;
      width: 3px;
      height: 1.15em;
      background: linear-gradient(180deg, var(--red), var(--red2));
      border-radius: 99px;

    /* Card number badge */

      letter-spacing: 0.04em;
      z-index: 1;
    }
  </style>
</head>

  <!-- ═══════════════════════════════════ SCRIPT ═══════════════════════════════════ -->
  <script>
    // ─── PARTICLES ───────────────────────────────────────────────────────────────
    (function spawnParticles() {
      const container = document.getElementById('particles');
      const colors = ['rgba(255,23,68,0.6)', 'rgba(255,69,105,0.4)', 'rgba(255,255,255,0.2)', 'rgba(255,23,68,0.3)'];
      for (let i = 0; i < 18; i++) {
        const el = document.createElement('div');
        el.className = 'particle';
        const size = 2 + Math.random() * 4;
        el.style.cssText = `
        width: ${size}px;
        height: ${size}px;
        left: ${Math.random() * 100}%;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        animation-duration: ${12 + Math.random() * 18}s;
        animation-delay: ${-Math.random() * 20}s;
        filter: blur(${Math.random() > 0.5 ? 1 : 0}px);
      `;
        container.appendChild(el);
      }
    })();

    // ─── CONFIG ──────────────────────────────────────────────────────────────────
    const {
      TMDB_API_KEY,
      TMDB_BASE,
      IMG_BASE,
      SOURCES,
    } = window.APP_CONFIG || {
      TMDB_API_KEY: '',
      TMDB_BASE: '',
      IMG_BASE: '',
      SOURCES: [{ name: 'Main Server', type: 'path', base: 'https://vidfast.vc' }],
    };

    function setMobileActive(btn) {
      document.querySelectorAll('.mobile-nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // ─── CONTINUE WATCHING (guest · localStorage) ─────────────────────────────────
    const CW_KEY = 'wf_continue';

    function getCW() {
      try {
        const items = JSON.parse(localStorage.getItem(CW_KEY)) || [];
        return items.map(i => ({
          ...i,
          key: i.key || cwKey(i.id, i.media_type === 'tv' ? 'tv' : 'movie'),
        }));
      }
      catch (e) { return []; }
    }

    function setCW(items) {
      try { localStorage.setItem(CW_KEY, JSON.stringify(items.slice(0, 30))); }
      catch (e) { }
    }

    function cwMediaType(item) {
      return !!(item.first_air_date || (item.name && !item.title)) ? 'tv' : 'movie';
    }

    function cwKey(id, type) { return type + ':' + id; }

    function findCW(id, type) {
      const k = cwKey(id, type);
      return getCW().find(i => i.key === k) || null;
    }

    function saveToHistory(item) {
      if (!item || item.id === undefined) return;
      const type = cwMediaType(item);
      const key = cwKey(item.id, type);
      const items = getCW();
      const existing = items.find(i => i.key === key);
      const entry = existing || {
        key,
        id: item.id,
        media_type: type,
        title: item.title || item.name || 'Unknown',
        poster_path: item.poster_path || null,
        season: null,
        episode: null,
        watch_seconds: 0,
        position: 0,
        duration: 0,
        progress: 0,
      };
      if (type === 'tv') {
        const s = document.getElementById('seasonSelect');
        const e = document.getElementById('episodeSelect');
        if (s && e && s.value && e.value) {
          entry.season = Number(s.value);
          entry.episode = Number(e.value);
        } else if (item.season && item.episode) {
          entry.season = item.season;
          entry.episode = item.episode;
        }
      }
      entry.watched_at = new Date().toISOString();
      setCW([entry, ...items.filter(i => i.key !== key)]);
      refreshContinueRow();
    }

    function progressLabel(it) {
      if (it.progress >= 100) return 'Done';
      if (it.media_type === 'tv') {
        return it.season && it.episode ? `S${it.season}·E${it.episode}` : 'Resume';
      }
      return it.progress > 0 ? `${Math.round(it.progress)}%` : 'Start';
    }

    function continueFakeItem(it) {
      return {
        id: it.id,
        title: it.media_type === 'movie' ? it.title : undefined,
        name: it.media_type === 'tv' ? it.title : undefined,
        poster_path: it.poster_path,
        first_air_date: it.media_type === 'tv' ? ' ' : undefined,
        season: it.season,
        episode: it.episode,
      };
    }

    function refreshContinueRow() {
      const section = document.getElementById('continueSection');
      const row = document.getElementById('continueRow');
      if (!section || !row) return;
      const items = getCW();
      if (!items.length) {
        section.style.display = 'none';
        row.innerHTML = '';
        if (editMode) toggleEditMode(false);
        return;
      }
      section.style.display = 'block';
      row.innerHTML = items.map(it => {
        const backdrop = it.poster_path
          ? `${IMG_BASE}/w500${it.poster_path}`
          : 'https://via.placeholder.com/500x281/111120/ff1744?text=?';
        const badge = it.media_type === 'tv' ? 'TV' : 'Movie';
        const fake = continueFakeItem(it);
        const dataAttr = encodeURIComponent(JSON.stringify(fake)).replace(/'/g, "%27");
        const pct = Math.max(2, Math.min(100, it.progress || 0));
        const remain = it.duration > 0 && it.progress < 100
          ? `${Math.max(1, Math.round((it.duration * (100 - pct)) / 100 / 60))}m left`
          : '';
        return `
<div class="continue-card" data-key="${it.key}" data-item="${dataAttr}">
  <div class="continue-thumb">
    <img src="${backdrop}" alt="${escHtml(it.title)}" loading="lazy" />
    <div class="continue-select-dot"><i data-lucide="check" style="width:12px;height:12px;"></i></div>
    <div class="continue-overlay">
      <div class="continue-play-icon">
        <i data-lucide="play" style="width:18px;height:18px;fill:currentColor;"></i>
      </div>
    </div>
    <div class="continue-progress"><div class="continue-progress-bar" style="width:${pct}%"></div></div>
  </div>
  <div class="continue-info">
    <div class="continue-title">${escHtml(it.title)}</div>
    <div class="continue-meta">
      <span class="continue-badge">${badge}</span>
      <span class="continue-state">${progressLabel(it)}</span>
      ${remain ? `<span class="continue-remain">${remain}</span>` : ''}
    </div>
  </div>
</div>`;
      }).join('');
      lucide.createIcons();
    }

    function playFromContinue(item) {
      if (typeof item === 'string') {
        try { item = JSON.parse(decodeURIComponent(item)); } catch (e) {
          try { item = JSON.parse(item); } catch (err) { return; }
        }
      }
      openPlayer(item);
    }

    function scrollContinue(dir) {
      const row = document.getElementById('continueRow');
      if (row) row.scrollBy({ left: dir * 280, behavior: 'smooth' });
    }

    document.getElementById('continueRow').addEventListener('click', (e) => {
      const card = e.target.closest('.continue-card');
      if (!card) return;
      e.preventDefault();
      if (editMode) {
        card.classList.toggle('selected');
        updateRemoveBtn();
      } else {
        const item = card.getAttribute('data-item');
        if (item) playFromContinue(item);
      }
    });

    // ─── CONTINUE EDIT MODE ───────────────────────────────────────────────────────
    function toggleEditMode(on) {
      editMode = on;
      document.getElementById('continueSection').classList.toggle('edit-mode', on);
      document.getElementById('continueEditBtn').style.display = on ? 'none' : '';
      document.getElementById('continueDoneBtn').style.display = on ? '' : 'none';
      document.getElementById('continueRemoveBtn').style.display = on ? '' : 'none';
      document.querySelectorAll('#continueRow .continue-card').forEach(c => c.classList.remove('selected'));
      updateRemoveBtn();
    }

    function updateRemoveBtn() {
      const n = document.querySelectorAll('#continueRow .continue-card.selected').length;
      const btn = document.getElementById('continueRemoveBtn');
      if (!btn) return;
      btn.textContent = n ? `Remove (${n})` : 'Remove';
      btn.disabled = !n;
    }

    function removeSelected() {
      const selected = [...document.querySelectorAll('#continueRow .continue-card.selected')];
      if (!selected.length) return;
      const keys = selected.map(c => c.getAttribute('data-key'));
      selected.forEach(c => c.classList.add('removing'));
      setTimeout(() => {
        setCW(getCW().filter(i => !keys.includes(i.key)));
        toggleEditMode(false);
        refreshContinueRow();
      }, 300);
    }

    // ─── PROGRESS TRACKING ────────────────────────────────────────────────────────
    let watchTimer = null;
    let watchSessionStart = 0;
    const PROGRESS_TARGET = 120;

    function startWatchTimer() {
      stopWatchTimer();
      watchSessionStart = Date.now();
      watchTimer = setInterval(() => tickWatchProgress(), 10000);
    }

    function stopWatchTimer() {
      if (watchTimer) { clearInterval(watchTimer); watchTimer = null; }
    }

    function activeCWEntry() {
      if (!playingItem || playingItem.id === undefined) return null;
      return findCW(playingItem.id, cwMediaType(playingItem));
    }

    function updateCWCard(entry) {
      const card = document.querySelector(`.continue-card[data-key="${entry.key}"]`);
      if (!card) return;
      const bar = card.querySelector('.continue-progress-bar');
      if (bar) bar.style.width = `${Math.max(2, Math.min(100, entry.progress || 0))}%`;
      const state = card.querySelector('.continue-state');
      if (state) state.textContent = progressLabel(entry);
    }

    function tickWatchProgress() {
      if (!playingItem || playingItem.id === undefined) return;
      const entry = activeCWEntry();
      if (!entry) return;
      const elapsed = (Date.now() - watchSessionStart) / 1000;
      watchSessionStart = Date.now();
      entry.watch_seconds = (entry.watch_seconds || 0) + elapsed;
      const realPct = entry.duration > 0 ? (entry.position / entry.duration) * 100 : 0;
      entry.progress = realPct > 0
        ? Math.min(100, realPct)
        : Math.min(100, (entry.watch_seconds / PROGRESS_TARGET) * 100);
      const items = getCW();
      const idx = items.findIndex(i => i.key === entry.key);
      if (idx > -1) { items[idx] = entry; setCW(items); }
      updateCWCard(entry);
    }

    function extractProgress(o) {
      if (!o || typeof o !== 'object') return null;
      if (typeof o.currentTime === 'number' && typeof o.duration === 'number' && o.duration > 0) {
        return { position: o.currentTime, duration: o.duration };
      }
      for (const v of Object.values(o)) {
        const r = extractProgress(v);
        if (r) return r;
      }
      return null;
    }

    window.addEventListener('message', (e) => {
      if (!playingItem || playingItem.id === undefined) return;
      const entry = activeCWEntry();
      if (!entry) return;
      const p = extractProgress(e.data);
      if (!p || !isFinite(p.position)) return;
      entry.position = Math.max(0, p.position);
      entry.duration = p.duration > 0 ? p.duration : entry.duration;
      if (entry.duration > 0) entry.progress = Math.min(100, (entry.position / entry.duration) * 100);
      const items = getCW();
      const idx = items.findIndex(i => i.key === entry.key);
      if (idx > -1) { items[idx] = entry; setCW(items); }
      updateCWCard(entry);
    });

    // ─── TMDB FETCH ───────────────────────────────────────────────────────────────
    async function tmdbFetch(endpoint, params = {}) {
      const key = TMDB_API_KEY.trim();
      const isToken = key.length > 60;
      let url = `${TMDB_BASE}/${endpoint}`;
      const options = { method: 'GET', headers: { 'Accept': 'application/json' } };
      if (isToken) { options.headers['Authorization'] = `Bearer ${key}`; }
      else { params['api_key'] = key; }
      const sParams = new URLSearchParams(params);
      if (!params.language) sParams.set('language', 'en-US');
      const query = sParams.toString();
      if (query) url += (url.includes('?') ? '&' : '?') + query;
      const res = await fetch(url, options);
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.status_message || `HTTP ${res.status}`);
      }
      return await res.json();
    }

    // ─── STATE ────────────────────────────────────────────────────────────────────
    let currentTab = 'movie';
    let heroItems = [];
    let heroIndex = 0;
    let heroTimer = null;
    let currentItem = null;
    let playingItem = null;
    let currentSourceIndex = 0;
    let tvSeasons = [];
    let searchTimeout = null;
    let editMode = false;

    // ─── INIT ────────────────────────────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      fetchAll();
      setupSearch();
      setupNavScroll();
    });

    function setupNavScroll() {
      const nav = document.getElementById('mainNav');
      window.addEventListener('scroll', () => {
        nav.classList.toggle('scrolled', window.scrollY > 40);
      });
    }

    // ─── SEARCH ──────────────────────────────────────────────────────────────────
    function setupSearch() {
      function handleSearch(q) {
        clearTimeout(searchTimeout);
        if (!q) { fetchAll(); return; }
        document.getElementById('heroSection').style.display = 'none';
        document.getElementById('continueSection').style.display = 'none';
        document.getElementById('topRatedSection').style.display = 'none';
        document.querySelector('#trendingSection .see-all').style.display = 'none';
        document.getElementById('trendingSection').classList.add('searching');
        document.querySelector('.main-content').classList.add('search-active');
        document.querySelector('#trendingSection .nfx-row-title').innerHTML = `Results for "<span>${escHtml(q)}</span>" <span class="search-count">Searching...</span>`;
        showSkeletons('trendingRow', 12);
        searchTimeout = setTimeout(() => searchContent(q), 400);
      }

      const inp = document.getElementById('searchInput');
      inp.addEventListener('input', () => handleSearch(inp.value.trim()));

      const mobileInp = document.getElementById('mobileSearchInput');
      if (mobileInp) {
        mobileInp.addEventListener('input', () => handleSearch(mobileInp.value.trim()));
      }
    }

    function goHome(e) {
      if (e) e.preventDefault();
      document.getElementById('searchInput').value = '';
      const mobileInp = document.getElementById('mobileSearchInput');
      if (mobileInp) mobileInp.value = '';
      fetchAll();
    }

    async function searchContent(query) {
      try {
        const [movieData, tvData] = await Promise.all([
          tmdbFetch('search/movie', { query, page: 1 }),
          tmdbFetch('search/tv', { query, page: 1 })
        ]);
        const movies = (movieData.results || []).map(m => ({ ...m, media_type: 'movie' }));
        const tvs = (tvData.results || []).map(t => ({ ...t, media_type: 'tv' }));
        const results = [...movies, ...tvs].sort((a, b) => (b.vote_count || 0) - (a.vote_count || 0));
        const count = results.length;
        const countText = count > 0
          ? `${count} results`
          : `No results found`;
        document.querySelector('#trendingSection .nfx-row-title').innerHTML = `Results for "<span>${escHtml(query)}</span>" <span class="search-count">${countText}</span>`;
        renderRow('trendingRow', results);
      } catch (e) { showApiError(e); }
    }

    // ─── TAB SWITCH ──────────────────────────────────────────────────────────────
    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('searchInput').value = '';
      const mobileInp = document.getElementById('mobileSearchInput');
      if (mobileInp) mobileInp.value = '';
      document.getElementById('tabMovies').classList.toggle('active', tab === 'movie');
      document.getElementById('tabTV').classList.toggle('active', tab === 'tv');
      const label = tab === 'movie' ? 'Movies' : 'TV Shows';
      document.getElementById('sectionLabel').textContent = label;
      fetchAll();
      lucide.createIcons();
    }

    // ─── FETCH ALL ───────────────────────────────────────────────────────────────
    async function fetchAll() {
      document.getElementById('heroSection').style.display = 'flex';
      document.getElementById('topRatedSection').style.display = 'block';
      document.querySelector('#trendingSection .see-all').style.display = 'flex';
      document.getElementById('trendingSection').classList.remove('searching');
      document.querySelector('.main-content').classList.remove('search-active');
      const label = currentTab === 'movie' ? 'Movies' : 'TV Shows';
      document.querySelector('#trendingSection .nfx-row-title').innerHTML = `Trending <span id="sectionLabel">${label}</span> <span class="nfx-row-tag">HOT</span>`;
      showSkeletons('trendingRow', 12);
      showSkeletons('topRatedRow', 12);
      const type = currentTab;
      try {
        const [trending, topRated] = await Promise.all([
          fetchItems(`trending/${type}/week`),
          fetchItems(`${type}/top_rated`),
        ]);
        heroItems = trending.slice(0, 5);
        setupHero();
        renderRow('trendingRow', trending);
        renderRow('topRatedRow', topRated);
        refreshContinueRow();
      } catch (e) { showApiError(e); }
    }

    async function fetchItems(endpoint) {
      try {
        const data = await tmdbFetch(endpoint, { page: 1 });
        return data.results || [];
      } catch (e) { return []; }
    }

    // ─── HERO ─────────────────────────────────────────────────────────────────────
    function startHeroRotation() {
      clearInterval(heroTimer);
      heroTimer = setInterval(() => {
        heroIndex = (heroIndex + 1) % heroItems.length;
        showHeroItem(heroIndex);
      }, 7000);
    }

    function stopHeroRotation() {
      if (heroTimer) { clearInterval(heroTimer); heroTimer = null; }
    }

    function setupHero() {
      if (!heroItems.length) return;
      buildHeroDots();
      showHeroItem(0);
      startHeroRotation();
    }

    function buildHeroDots() {
      const dots = document.getElementById('heroDots');
      dots.innerHTML = heroItems.map((_, i) =>
        `<button class="hero-dot ${i === 0 ? 'active' : ''}" onclick="goHero(${i})"></button>`
      ).join('');
    }

    function goHero(i) {
      heroIndex = i;
      showHeroItem(i);
      startHeroRotation();
    }

    function showHeroItem(i) {
      const item = heroItems[i];
      const bg = document.getElementById('heroBg');
      const title = item.title || item.name || 'Unknown';

      // Animate bg transition
      bg.classList.add('transitioning');
      setTimeout(() => {
        bg.style.backgroundImage = item.backdrop_path
          ? `url(${IMG_BASE}/original${item.backdrop_path})`
          : 'linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%)';
        bg.classList.remove('transitioning');
      }, 300);

      document.getElementById('heroTitle').textContent = title;
      document.getElementById('heroOverview').textContent = item.overview || 'No description available.';
      document.getElementById('heroRating').innerHTML = `<i data-lucide="star" style="width:11px;height:11px;fill:currentColor;"></i> ${item.vote_average?.toFixed(1) || '—'}`;
      document.getElementById('heroYear').textContent =
        (item.release_date || item.first_air_date || '').slice(0, 4) || '—';
      document.getElementById('heroGenre').textContent =
        currentTab === 'movie' ? 'Movie' : 'TV Show';
      document.querySelectorAll('.hero-dot').forEach((d, idx) => {
        d.classList.toggle('active', idx === i);
      });
      currentItem = item;
      lucide.createIcons();
    }

    function heroPlay() {
      if (!currentItem) return;
      openPlayer(currentItem);
    }

    function heroInfo() {
      if (!currentItem) return;
      const title = currentItem.title || currentItem.name;
      showToast(`"${title}" — ${currentItem.overview?.slice(0, 80)}…`);
    }

    // ─── ROW RENDERING ────────────────────────────────────────────────────────────
    function renderRow(rowId, items) {
      const row = document.getElementById(rowId);
      if (!items.length) {
        row.innerHTML = `<div class="empty-state" style="width:100%;display:flex;flex-direction:column;align-items:center;min-height:200px;justify-content:center;">
<i data-lucide="search-x" style="width:36px;height:36px;color:var(--red);margin:0 auto 1rem;display:block;opacity:0.6;"></i>
<h3>Nothing found</h3>
<p style="font-size:0.82rem;margin-top:0.3rem;">Try a different search.</p>
</div>`;
        lucide.createIcons();
        return;
      }
      row.innerHTML = items.map((item, idx) => cardHTML(item, idx)).join('');
      lucide.createIcons();
    }

    function scrollRow(rowId, dir) {
      const row = document.getElementById(rowId);
      row.scrollBy({ left: dir * (185 * 4 + 10 * 4), behavior: 'smooth' });
    }

    function cardHTML(item, idx) {
      const title = escHtml(item.title || item.name || 'Unknown');
      const year = (item.release_date || item.first_air_date || '').slice(0, 4);
      const rating = item.vote_average?.toFixed(1) || '—';
      const poster = item.poster_path
        ? `${IMG_BASE}/w342${item.poster_path}`
        : 'https://via.placeholder.com/342x513/111120/ff1744?text=No+Image';

      const encodedItem = encodeURIComponent(JSON.stringify(item)).replace(/'/g, "%27");
      return `
<div class="nfx-card" onclick="openPlayer('${encodedItem}')">
  <div class="nfx-card-inner">
    <img class="nfx-card-poster" src="${poster}" alt="${title}" loading="lazy" />
    <div class="nfx-card-overlay">
      <div class="nfx-card-play">
        <i data-lucide="play" style="width:17px;height:17px;fill:currentColor;margin-left:2px;"></i>
      </div>
    </div>
    <div class="nfx-card-info">
      <div class="nfx-card-title">${title}</div>
      <div class="nfx-card-meta">
        <span>${year || '—'}</span>
        <span class="nfx-card-rating">
          <i data-lucide="star" style="width:10px;height:10px;fill:currentColor;"></i>
          ${rating}
        </span>
      </div>
    </div>
  </div>
</div>`;
    }

    // ─── SKELETONS ────────────────────────────────────────────────────────────────
    function showSkeletons(rowId, count) {
      const row = document.getElementById(rowId);
      row.innerHTML = Array.from({ length: count }, () => `
<div class="skeleton-card">
  <div class="skeleton skeleton-poster"></div>
  <div class="skeleton skeleton-line"></div>
  <div class="skeleton skeleton-line-sm"></div>
</div>`).join('');
    }

    // ─── PLAYER / MODAL ──────────────────────────────────────────────────────────
    async function openPlayer(item) {
      if (typeof item === 'string') {
        try {
          item = JSON.parse(decodeURIComponent(item));
        } catch (e) {
          try { item = JSON.parse(item); } catch (err) { return; }
        }
      }
      playingItem = item;
      currentSourceIndex = 0;
      const isTV = !!(item.first_air_date || item.name && !item.title);
      const title = item.title || item.name;
      document.getElementById('modalTitle').textContent = title;
      buildSourceSwitcher();
      document.getElementById('playerModal').classList.add('open');
      document.body.style.overflow = 'hidden';
      stopHeroRotation();
      saveToHistory(item);
      if (isTV) {
        document.getElementById('episodeBar').style.display = 'flex';
        await buildSeasonSelector(item.id);
        if (item.season && item.episode) {
          const seasonSel = document.getElementById('seasonSelect');
          if (seasonSel.value !== String(item.season)) {
            seasonSel.value = String(item.season);
            await buildEpisodeSelector(item.id, Number(item.season));
          }
          const epSel = document.getElementById('episodeSelect');
          if (epSel.value !== String(item.episode)) epSel.value = String(item.episode);
          reloadCurrentPlayer();
        }
        saveToHistory(playingItem);
      } else {
        document.getElementById('episodeBar').style.display = 'none';
        loadPlayerSrc(buildSourceUrl(item.id, false));
      }
      startWatchTimer();
      lucide.createIcons();
    }

    function closeModal() {
      tickWatchProgress();
      stopWatchTimer();
      document.getElementById('playerModal').classList.remove('open');
      document.getElementById('playerFrame').src = '';
      document.body.style.overflow = '';
      playingItem = null;
      startHeroRotation();
    }

    function buildSourceSwitcher() {
      const container = document.getElementById('sourceSwitcher');
      container.innerHTML = SOURCES.map((s, i) =>
        `<button class="source-btn ${i === currentSourceIndex ? 'active' : ''}" onclick="switchSource(${i})">${s.name}</button>`
      ).join('');
    }

    function loadPlayerSrc(src) {
      document.getElementById('playerFrame').src = src;
    }

    function switchSource(index) {
      currentSourceIndex = index;
      buildSourceSwitcher();
      reloadCurrentPlayer();
    }

    function reloadCurrentPlayer() {
      if (!playingItem) return;
      const isTV = !!(playingItem.first_air_date || (playingItem.name && !playingItem.title));
      if (isTV) {
        const s = document.getElementById('seasonSelect').value;
        const e = document.getElementById('episodeSelect').value;
        loadPlayerSrc(buildSourceUrl(playingItem.id, true, s, e));
      } else {
        loadPlayerSrc(buildSourceUrl(playingItem.id, false));
      }
    }

    function buildSourceUrl(id, isTV, season, episode) {
      const src = SOURCES[currentSourceIndex];
      if (!src) return '';
      if (src.base.includes('multiembed.mov')) {
        if (isTV) return `${src.base}/?video_id=${id}&tmdb=1&s=${season}&e=${episode}`;
        return `${src.base}/?video_id=${id}&tmdb=1`;
      }
      if (isTV) {
        if (src.type === 'segment') return `${src.base}/tv/${id}/season/${season}/episode/${episode}`;
        return `${src.base}/tv/${id}/${season}/${episode}`;
      }
      return `${src.base}/movie/${id}`;
    }

    // ─── TV SEASONS / EPISODES ────────────────────────────────────────────────────
    async function buildSeasonSelector(tvId) {
      const seasonSel = document.getElementById('seasonSelect');
      const episodeSel = document.getElementById('episodeSelect');
      seasonSel.innerHTML = `<option>Loading…</option>`;
      episodeSel.innerHTML = `<option>—</option>`;
      try {
        const data = await tmdbFetch(`tv/${tvId}`);
        tvSeasons = (data.seasons || []).filter(s => s.season_number > 0);
        seasonSel.innerHTML = tvSeasons.map(s =>
          `<option value="${s.season_number}">${s.name || 'Season ' + s.season_number}</option>`
        ).join('');
        await buildEpisodeSelector(tvId, tvSeasons[0]?.season_number || 1);
      } catch (e) {
        seasonSel.innerHTML = `<option value="1">Season 1</option>`;
        buildEpisodeSelector(tvId, 1);
      }
    }

    async function buildEpisodeSelector(tvId, seasonNum) {
      const episodeSel = document.getElementById('episodeSelect');
      episodeSel.innerHTML = `<option>Loading…</option>`;
      try {
        const data = await tmdbFetch(`tv/${tvId}/season/${seasonNum}`);
        const eps = data.episodes || [];
        episodeSel.innerHTML = eps.map(e =>
          `<option value="${e.episode_number}">Ep ${e.episode_number}: ${e.name || ''}</option>`
        ).join('');
        const ep = eps[0]?.episode_number || 1;
        loadPlayerSrc(buildSourceUrl(tvId, true, seasonNum, ep));
      } catch (e) {
        episodeSel.innerHTML = `<option value="1">Episode 1</option>`;
        loadPlayerSrc(buildSourceUrl(tvId, true, seasonNum, 1));
      }
    }

    async function onSeasonChange() {
      if (!playingItem) return;
      const s = document.getElementById('seasonSelect').value;
      await buildEpisodeSelector(playingItem.id, s);
    }

    function onEpisodeChange() {
      if (!playingItem) return;
      const s = document.getElementById('seasonSelect').value;
      const e = document.getElementById('episodeSelect').value;
      loadPlayerSrc(buildSourceUrl(playingItem.id, true, s, e));
      saveToHistory(playingItem);
    }

    // ─── LOAD MORE ────────────────────────────────────────────────────────────────
    async function loadMore() {
      showToast('Loading more content…');
      const type = currentTab;
      try {
        const data = await tmdbFetch(`trending/${type}/week`, { page: 2 });
        const row = document.getElementById('trendingRow');
        const currentCount = row.querySelectorAll('.nfx-card').length;
        const html = (data.results || []).map((item, idx) => cardHTML(item, currentCount + idx)).join('');
        row.insertAdjacentHTML('beforeend', html);
        lucide.createIcons();
      } catch (e) { showApiError(e); }
    }

    // ─── TOAST ───────────────────────────────────────────────────────────────────
    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
    }

    function showApiError(err) {
      console.error('TMDB Error:', err);
      const msg = err?.message || 'Check API key configuration.';
      showToast(`⚠ ${msg}`);
      renderRow('trendingRow', []);
      renderRow('topRatedRow', []);
    }

    // ─── UTILITIES ────────────────────────────────────────────────────────────────
    function escHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Close modal on backdrop click
    document.getElementById('playerModal').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });

    // Keyboard
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeModal(); }
    });
  </script>
</body>

</html>
